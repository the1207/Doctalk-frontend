<div class="layout">
  <header class="header">
    <div class="header-left">
      <h1>📄 DocTalk</h1>
    </div>
    <div class="header-right">
      <span class="username">{{ username }}</span>
      <button type="button" class="btn-logout" (click)="logout()">Déconnexion</button>
    </div>
  </header>

  <div class="layout-body">
    <aside class="sidebar">
      <nav>
        <ul>
          <li>
            <a routerLink="/documents" routerLinkActive="active">
              📂 Documents
            </a>
          </li>
          <li>
            <a routerLink="/tags" routerLinkActive="active">
              🏷️ Tags
            </a>
          </li>
          <li>
            <a routerLink="/folders" routerLinkActive="active">
              📁 Dossiers
            </a>
          </li>
          <li>
            <a routerLink="/chat" routerLinkActive="active">
              💬 Chat
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
